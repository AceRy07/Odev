<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <!-- 
    BEM Adlanadırma Kuralı
    Block -> Bağımsız kendi başına bir anlam ifade eden nesne (header, card, navbar)
    Element -> Blokun bir parçası olan ve blokla birlikte anlam ifade eden nesne (header__logo, card__title)
    Modifier -> Bir elemanın farklı bir durum/verionu (btn--primary, card--featured)
    -->


    <!-- Navigation Bar -->
    <header class="main-header">
        <nav class="navbar navbar-expand container-fluid px-4" aria-label="Main Navigation">
            <div class="d-flex justify-content-between align-items-center w-100">
                <!-- Block: main-header / Eleman: left -->
                <div class="main-header__left d-flex align-items-center gap-3">
                    <!-- Tıklanabilir buton: -->
                    <button type="button" class="main-header__btn btn btn-icon" aria-label="Menu Open" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <!-- Anlamsal olarak Logo bir linktir -->
                    <a href="#" class="main-header__logo navbar-brand me-0"><svg xmlns="http://www.w3.org/2000/svg" width="100" height="30" fill="none" aria-labelledby="wordmark-medium-desc" viewBox="0 0 719 160" class="bn bo bp"><desc>Medium Logo</desc><path fill="#242424" d="m174.104 9.734.215-.047V8.02H130.39L89.6 103.89 48.81 8.021H1.472v1.666l.212.047c8.018 1.81 12.09 4.509 12.09 14.242V137.93c0 9.734-4.087 12.433-12.106 14.243l-.212.047v1.671h32.118v-1.665l-.213-.048c-8.018-1.809-12.089-4.509-12.089-14.242V30.586l52.399 123.305h2.972l53.925-126.743V140.75c-.687 7.688-4.721 10.062-11.982 11.701l-.215.05v1.652h55.948v-1.652l-.215-.05c-7.269-1.639-11.4-4.013-12.087-11.701l-.037-116.774h.037c0-9.733 4.071-12.432 12.087-14.242m25.555 75.488c.915-20.474 8.268-35.252 20.606-35.507 3.806.063 6.998 1.312 9.479 3.714 5.272 5.118 7.751 15.812 7.368 31.793zm-.553 5.77h65.573v-.275c-.186-15.656-4.721-27.834-13.466-36.196-7.559-7.227-18.751-11.203-30.507-11.203h-.263c-6.101 0-13.584 1.48-18.909 4.16-6.061 2.807-11.407 7.003-15.855 12.511-7.161 8.874-11.499 20.866-12.554 34.343q-.05.606-.092 1.212a50 50 0 0 0-.065 1.151 85.807 85.807 0 0 0-.094 5.689c.71 30.524 17.198 54.917 46.483 54.917 25.705 0 40.675-18.791 44.407-44.013l-1.886-.664c-6.557 13.556-18.334 21.771-31.738 20.769-18.297-1.369-32.314-19.922-31.042-42.395m139.722 41.359c-2.151 5.101-6.639 7.908-12.653 7.908s-11.513-4.129-15.418-11.63c-4.197-8.053-6.405-19.436-6.405-32.92 0-28.067 8.729-46.22 22.24-46.22 5.657 0 10.111 2.807 12.236 7.704zm43.499 20.008c-8.019-1.897-12.089-4.722-12.089-14.951V1.309l-48.716 14.353v1.757l.299-.024c6.72-.543 11.278.386 13.925 2.83 2.072 1.915 3.082 4.853 3.082 8.987v18.66c-4.803-3.067-10.516-4.56-17.448-4.56-14.059 0-26.909 5.92-36.176 16.672-9.66 11.205-14.767 26.518-14.767 44.278-.003 31.72 15.612 53.039 38.851 53.039 13.595 0 24.533-7.449 29.54-20.013v16.865h43.711v-1.746zM424.1 19.819c0-9.904-7.468-17.374-17.375-17.374-9.859 0-17.573 7.632-17.573 17.374s7.721 17.374 17.573 17.374c9.907 0 17.375-7.47 17.375-17.374m11.499 132.546c-8.019-1.897-12.089-4.722-12.089-14.951h-.035V43.635l-43.714 12.551v1.705l.263.024c9.458.842 12.047 4.1 12.047 15.152v81.086h43.751v-1.746zm112.013 0c-8.018-1.897-12.089-4.722-12.089-14.951V43.635l-41.621 12.137v1.71l.246.026c7.733.813 9.967 4.257 9.967 15.36v59.279c-2.578 5.102-7.415 8.131-13.274 8.336-9.503 0-14.736-6.419-14.736-18.073V43.638l-43.714 12.55v1.703l.262.024c9.459.84 12.05 4.097 12.05 15.152v50.17a56.3 56.3 0 0 0 .91 10.444l.787 3.423c3.701 13.262 13.398 20.197 28.59 20.197 12.868 0 24.147-7.966 29.115-20.43v17.311h43.714v-1.747zm169.818 1.788v-1.749l-.213-.05c-8.7-2.006-12.089-5.789-12.089-13.49v-63.79c0-19.89-11.171-31.761-29.883-31.761-13.64 0-25.141 7.882-29.569 20.16-3.517-13.01-13.639-20.16-28.606-20.16-13.146 0-23.449 6.938-27.869 18.657V43.643L545.487 55.68v1.715l.263.024c9.345.829 12.047 4.181 12.047 14.95v81.784h40.787v-1.746l-.215-.053c-6.941-1.631-9.181-4.606-9.181-12.239V66.998c1.836-4.289 5.537-9.37 12.853-9.37 9.086 0 13.692 6.296 13.692 18.697v77.828h40.797v-1.746l-.215-.053c-6.94-1.631-9.18-4.606-9.18-12.239V75.066a42 42 0 0 0-.578-7.26c1.947-4.661 5.86-10.177 13.475-10.177 9.214 0 13.691 6.114 13.691 18.696v77.828z"></path></svg></a>

                    <!-- Arama Formu: Anlamsal olarak form  -->
                    <form class="main-header__search-form d-none d-md-block" role="search">
                        <input class="form-control rounded-pill bg-light border-0 px-3" type="search" placeholder="Search" aria-label="Search">
                    </form>
                </div>

                <!-- Block: main-header / Eleman: right -->
                <div class="main-header__right d-flex align-items-center gap-4">
                    <a href="#" class="main-header__link text-decoration-none text-muted d-flex align-items-center gap-2">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>Write</span>
                    </a>
                    
                    <button class="main-header__action-btn btn p-0 border-0 text-muted" aria-label="Notifications" type="button">
                        <i class="fa-solid fa-bell"></i>
                    </button>

                    <a href="#" class="main-header__profile-link text-decoration-none text-dark" aria-label="Profile">
                        <i class="fa-solid fa-circle-user fs-4" aria-hidden="true"></i>
                    </a>
                    
                </div>
            </div>
        </nav>
    </header>

    <!-- SideBar -->
    <!-- offcanvas-start -> Böylece panel soldan kayarak açılır -->
    <aside id="sidebarMenu" class="sidebar offcanvas offcanvas-start" tabindex="-1" aria-labelledby="sidebarMenuLabel">
        <div class="sidebar__header offcanvas-header border-bottom">
            <h5 class="sidebar__title offcanvas-title" id="sidebarMenuLabel">Medium Menu</h5>
            <!-- data-bs-dismiss="offcanvas" -> Bu buton offcanvas panelini kapatır -->
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <div class="sidebar__body offcanvas-body">
            <nav class="sidebar__nav">
                <ul class="sidebar__list nav flex-column gap-2">
                    <li class="sidebar__item nav-item">
                        <a class="sidebar__link nav-link text-dark fw-semibold" href="#">Dashboard</a>
                    </li>

                    <li class="sidebar__item nav-item">
                        <a class="sidebar__link nav-link text-dark fw-semibold" href="#">Home</a>
                    </li>

                    <li class="sidebar__item nav-item">
                        <a class="sidebar__link nav-link text-dark fw-semibold" href="#">Profile</a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>


    <section>
        <!-- row -> da marginleft: -15 marginright: -15px verdikleri için ekran sağ sola kayabiliyor.
            Bunu da engellemek için container-fluid kullanıyoruz. 
        -->
        <div class="container">
            <div class="row">
                <div class="col-sm-8 d-flex align-items-center  gap-3 mt-3">
                    <div class="section-title">
                        <a class="text-decoration-none text-dark mx-5 border-bottom border-dark" href="#">For You</a>
                        <a class="text-decoration-none text-dark" href="#">Featured</a>
                    </div>
                </div>

                <div class="col-sm-4 d-flex align-items-center justify-content-start gap-3 mt-3">
                    asd
                </div>
            </div>
        </div>
    </section>



    <div class="container mt-4">
        <div class="row">
            <!-- Main Feed (Ana Ak ış) -->
            <main class="col-lg-8">
                <article class="article-card border-bottom pb-4 mb-4">
                    <div class="row align-items-center">
                        <div class="col-8">
                            <header class="article-card__header d-flex align-items-center gap-2 mb-2">
                                <img class="profile-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRx2MPl0cP4JCKyDUZalUI22n5kjPSKM6BUfWmpLaIeeA&s=10" alt="profileImage">
                                <span class="article-card__author fs-7 fw-semibold text-dark">Cloud With Azeem</span>
                                <span class="article-card__date fs-7 text-muted">Jul 28</span>
                            </header>

                            <!-- İçerik Alanı -->
                            <section class="article-card__content mb-3">
                                <h2 class="article-card__title fs-4 fw-bold text-dark mb-1">
                                    Modern Java Has Changed More Than You Think
                                </h2>
                                <p class="article-card__summary text-muted fs-6 mb-0">
                                    After diving deep into Java 26, I realised this isn’t just another release — it’s a complete shift in how modern Java applications are…
                                </p>
                            </section>

                            <!-- Alt Menü Footer -->
                            <footer class="article-card__footer d-flex fs-7 text-muted justify-content-between align-items-center ">
                                <div class="aricle-card__actions-left d-flex gap-4 align-items-center">
                                    <span class="article-card__actions-left d-flex-align-items-center gap-4"><i class="fa-solid fa-thumbs-up"></i> 177</span>
                                    <span class="d-flex align-items-center gap-1"><i class="fa-solid fa-comment"></i> 22</span>
                                    <span class="d-flex align-items-center gap-1"><i class="fa-solid fa-share"></i> 1</span>
                                </div>

                                <div class="article-card__actions-right d-flex gap-3 align-items-center">
                                    <i class="fa-solid fa-thumbs-down"></i>
                                    <i class="fa-regular fa-bookmark"></i>
                                    <i class="fa-solid fa-ellipsis"></i>
                                </div>
                            </footer>
                        </div>

                        <!-- Kapak Resmi Alanı -->
                        <div class="col-4 text-end">
                            <img class="article-card__cover img-fluid rounded" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT5DML5-LsE2ghGUfq0MfVg10a_UM08IiONwrXWOhhLFA&s=10" alt="Java Logo">
                        </div>
                    </div>
                </article>
            </main>

            <aside class="col-lg-4">
                <!-- Sağ yan menü -->
            </aside>

        </div>
    </div>

    
    <script src="https://kit.fontawesome.com/4c639448c1.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
