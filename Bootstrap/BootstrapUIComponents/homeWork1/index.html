<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

<body>
    
    <header>
        <nav class="d-flex justify-content-evenly border-bottom border-1 border-dark">
            <div class="container row justify-content-between align-items-center">
                <div class="header__logo col-sm-12 col-md-1 col-lg-2">
                    <img class="header__logo-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScQsZSz6dCX6YWo0KV8Bdr5oeltAp_RNSJn6Wn84SkjMuEhiYbW059pija&s=10" alt="InstagramLogo">
                </div>

                <div class="header__search col-sm-12 col-md-8 col-lg-6 d-block d-md-none d-lg-block">
                    <form class="d-flex" action="#">
                        <div class="search-wrapper col">
                            <i class="fa-solid fa-magnifying-glass search-icon "></i>
                            <label for="arama-input" class="visually-hidden">Ara</label>
                            <input class="search-input" type="text" id="arama-input" placeholder="Search">
                        </div>
                    </form>
                </div>

                <div class="header__links col-sm-12 col-md-6 col-lg-4">
                    <ul class="nav justify-content-center">
                        <li class="nav-item"><a class="nav-link text-black" href="#"><i class="fa-solid fa-house"></i></a></li>
                        <li class="nav-item search d-lg-none d-md-block d-none"><a class="nav-link text-black" href="#"><i class="fa-solid fa-magnifying-glass"></i></a></li>
                        <li class="nav-item"><a class="nav-link text-black" href="#"><i class="fa-solid fa-comment"></i></a></li>
                        <li class="nav-item"><a class="nav-link text-black" href="#"><i class="fa-solid fa-compass"></i></a></li>
                        <li class="nav-item"><a class="nav-link text-black" href="#"><i class="fa-regular fa-heart"></i></a></li>
                        <li class="nav-item"><a class="nav-link text-black" href="#"><i class="fa-regular fa-circle-user"></i></a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
